<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <!-- Ornate emblem — stylised arch with two hanging drops, crimson/maroon -->
  <g transform="translate(160,20)" fill="none">
    <!-- Outer arch -->
    <path d="M0 0 C-42 0 -58 28 -58 55 C-58 82 -38 100 0 108 C38 100 58 82 58 55 C58 28 42 0 0 0Z"
          stroke="#8b1a2a" stroke-width="4" fill="none"/>
    <!-- Inner arch frame -->
    <path d="M0 8 C-34 8 -48 32 -48 55 C-48 78 -32 94 0 100 C32 94 48 78 48 55 C48 32 34 8 0 8Z"
          stroke="#8b1a2a" stroke-width="2.5" fill="none" opacity="0.5"/>
    <!-- Left hanging drop -->
    <path d="M-20 62 C-26 70 -26 82 -20 88 C-14 94 -6 94 -2 88 C2 82 0 70 -8 62 C-12 56 -16 56 -20 62Z"
          fill="#8b1a2a"/>
    <path d="M-14 70 C-16 74 -14 80 -10 82 C-8 83 -6 82 -5 80"
          stroke="#6a0f1d" stroke-width="1.5" fill="none"/>
    <!-- Right hanging drop -->
    <path d="M20 62 C26 70 26 82 20 88 C14 94 6 94 2 88 C-2 82 0 70 8 62 C12 56 16 56 20 62Z"
          fill="#8b1a2a"/>
    <path d="M14 70 C16 74 14 80 10 82 C8 83 6 82 5 80"
          stroke="#6a0f1d" stroke-width="1.5" fill="none"/>
    <!-- Centre line detail -->
    <line x1="0" y1="18" x2="0" y2="58" stroke="#8b1a2a" stroke-width="2.5"/>
    <!-- Top ornament dot -->
    <circle cx="0" cy="6" r="4" fill="#8b1a2a"/>
  </g>

  <!-- "OLD PALACE RESORT" — spaced silver/grey serif caps -->
  <text x="160" y="148"
        text-anchor="middle"
        font-family="'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif"
        font-size="19"
        font-weight="400"
        fill="#9a9a9a"
        letter-spacing="5">OLD PALACE RESORT</text>

  <!-- Red arc underline -->
  <path d="M72 162 Q160 178 248 162" stroke="#8b1a2a" stroke-width="2" fill="none"/>

  <!-- "SAHL HASHEESH" — lighter grey, tight spacing -->
  <text x="160" y="185"
        text-anchor="middle"
        font-family="'Palatino Linotype', Palatino, Georgia, serif"
        font-size="13"
        font-weight="300"
        fill="#707070"
        letter-spacing="7">SAHL HASHEESH</text>
</svg>
