<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">

  <!-- Ornate heart-arch emblem -->
  <g transform="translate(200, 18)">
    <!-- Outer arch shape: pointed top, round sides, open bottom -->
    <path d="
      M0 -55
      C-8 -62, -26 -58, -38 -44
      C-52 -28, -52 -8, -44 10
      C-36 28, -20 42, 0 52
      C20 42, 36 28, 44 10
      C52 -8, 52 -28, 38 -44
      C26 -58, 8 -62, 0 -55 Z
    " stroke="#8a1828" stroke-width="4" fill="none"/>

    <!-- Inner arch frame (thinner, smaller) -->
    <path d="
      M0 -44
      C-6 -50, -20 -46, -30 -34
      C-41 -20, -41 -4, -34 12
      C-27 26, -15 38, 0 46
      C15 38, 27 26, 34 12
      C41 -4, 41 -20, 30 -34
      C20 -46, 6 -50, 0 -44 Z
    " stroke="#8a1828" stroke-width="2" fill="none" opacity="0.5"/>

    <!-- Center vertical spine -->
    <line x1="0" y1="-42" x2="0" y2="8" stroke="#8a1828" stroke-width="3"/>

    <!-- Left hanging finial -->
    <path d="
      M-14 6
      C-20 12, -22 22, -18 30
      C-14 38, -6 40, -2 34
      C2 28, 0 18, -6 10
      C-9 6, -12 4, -14 6 Z
    " fill="#8a1828"/>
    <!-- Left finial inner curl -->
    <path d="M-14 28 C-14 34, -10 36, -8 32" stroke="#5a0e18" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Right hanging finial -->
    <path d="
      M14 6
      C20 12, 22 22, 18 30
      C14 38, 6 40, 2 34
      C-2 28, 0 18, 6 10
      C9 6, 12 4, 14 6 Z
    " fill="#8a1828"/>
    <!-- Right finial inner curl -->
    <path d="M14 28 C14 34, 10 36, 8 32" stroke="#5a0e18" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Top pointed tip accent -->
    <circle cx="0" cy="-56" r="3.5" fill="#8a1828"/>
  </g>

  <!-- "OLD PALACE RESORT" -->
  <text x="200" y="158"
    text-anchor="middle"
    font-family="'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif"
    font-size="22"
    font-weight="400"
    fill="#888888"
    letter-spacing="7">OLD PALACE RESORT</text>

  <!-- Red curved arc beneath text -->
  <path d="M68 174 Q200 194 332 174" stroke="#8a1828" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- "SAHL HASHEESH" -->
  <text x="200" y="200"
    text-anchor="middle"
    font-family="'Palatino Linotype', Palatino, Georgia, serif"
    font-size="14"
    font-weight="300"
    fill="#666666"
    letter-spacing="8">SAHL HASHEESH</text>

</svg>
