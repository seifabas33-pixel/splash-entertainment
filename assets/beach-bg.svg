<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Sky: deep blue to warm sunset orange -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d1a4a"/>
      <stop offset="30%"  stop-color="#1a3070"/>
      <stop offset="55%"  stop-color="#2e4a9a"/>
      <stop offset="72%"  stop-color="#7a4a28"/>
      <stop offset="84%"  stop-color="#c87030"/>
      <stop offset="94%"  stop-color="#e09040"/>
      <stop offset="100%" stop-color="#d08038"/>
    </linearGradient>

    <!-- Horizon warm glow -->
    <radialGradient id="horizonGlow" cx="50%" cy="68%" r="45%" gradientUnits="userSpaceOnUse"
      fx="960" fy="540" cx="960" cy="734" r="864">
      <stop offset="0%"  stop-color="#f0b050" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#c06830" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0d1a4a"  stop-opacity="0"/>
    </radialGradient>

    <!-- Sun disc glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#fff8d0" stop-opacity="1"/>
      <stop offset="20%" stop-color="#ffd060" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#f09030" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d07020" stop-opacity="0"/>
    </radialGradient>

    <!-- Sea -->
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2a5888"/>
      <stop offset="40%"  stop-color="#173a62"/>
      <stop offset="80%"  stop-color="#0a2040"/>
      <stop offset="100%" stop-color="#060e1e"/>
    </linearGradient>

    <!-- Sun reflection on water -->
    <radialGradient id="sunRefl" cx="50%" cy="0%" r="80%">
      <stop offset="0%"  stop-color="#f0a040" stop-opacity="0.75"/>
      <stop offset="40%" stop-color="#c07030" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0a2040" stop-opacity="0"/>
    </radialGradient>

    <!-- Pool water -->
    <linearGradient id="pool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3a85aa"/>
      <stop offset="60%"  stop-color="#1e5570"/>
      <stop offset="100%" stop-color="#0d2e48"/>
    </linearGradient>

    <!-- Pool light glow -->
    <radialGradient id="poolGlow" cx="50%" cy="25%" r="60%">
      <stop offset="0%"  stop-color="#60c8e8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1e5570" stop-opacity="0"/>
    </radialGradient>

    <!-- Building dark -->
    <linearGradient id="bld" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#1e2e52"/>
      <stop offset="60%" stop-color="#111826"/>
      <stop offset="100%" stop-color="#060c18"/>
    </linearGradient>

    <!-- Soft glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <!-- Vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%"   stop-color="transparent"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- Horizon warm glow -->
  <ellipse cx="960" cy="550" rx="900" ry="300" fill="#f0a040" opacity="0.35"/>

  <!-- Stars (upper portion only) -->
  <g opacity="0.7">
    <circle cx="100" cy="40"  r="1.3" fill="#fff"/>
    <circle cx="280" cy="75"  r="1.0" fill="#fff"/>
    <circle cx="430" cy="28"  r="1.5" fill="#fff"/>
    <circle cx="580" cy="95"  r="0.9" fill="#fff"/>
    <circle cx="720" cy="48"  r="1.2" fill="#fff"/>
    <circle cx="860" cy="22"  r="1.4" fill="#fff"/>
    <circle cx="1020" cy="68" r="1.0" fill="#fff"/>
    <circle cx="1160" cy="35" r="1.3" fill="#fff"/>
    <circle cx="1340" cy="82" r="0.9" fill="#fff"/>
    <circle cx="1480" cy="44" r="1.2" fill="#fff"/>
    <circle cx="1620" cy="18" r="1.5" fill="#fff"/>
    <circle cx="1780" cy="70" r="1.0" fill="#fff"/>
    <circle cx="1880" cy="38" r="1.1" fill="#fff"/>
    <circle cx="200"  cy="130" r="0.8" fill="#fff"/>
    <circle cx="620"  cy="150" r="0.8" fill="#fff"/>
    <circle cx="1100" cy="140" r="0.9" fill="#fff"/>
    <circle cx="1700" cy="120" r="0.8" fill="#fff"/>
  </g>

  <!-- Sun glow halo -->
  <ellipse cx="960" cy="540" rx="320" ry="130" fill="url(#sunGlow)" opacity="0.9"/>
  <!-- Sun disc -->
  <circle cx="960" cy="536" r="24" fill="#fff8d0" filter="url(#glow)"/>

  <!-- Horizon light band -->
  <rect x="0" y="530" width="1920" height="20" fill="#f0a040" opacity="0.5"/>

  <!-- Sea -->
  <rect x="0" y="542" width="1920" height="538" fill="url(#sea)"/>

  <!-- Sun reflection path on water -->
  <ellipse cx="960" cy="542" rx="300" ry="460" fill="url(#sunRefl)"/>

  <!-- Wave lines on sea -->
  <g stroke="#7ab8d8" stroke-width="1.2" fill="none" opacity="0.14">
    <path d="M0 580 Q240 568 480 580 Q720 592 960 580 Q1200 568 1440 580 Q1680 592 1920 580"/>
    <path d="M0 620 Q260 606 520 620 Q780 634 1040 620 Q1300 606 1560 620 Q1780 632 1920 620"/>
    <path d="M0 670 Q300 654 600 670 Q900 686 1200 670 Q1500 654 1760 670 Q1860 678 1920 670"/>
    <path d="M0 730 Q350 714 700 730 Q1000 746 1300 730 Q1600 714 1860 730"/>
    <path d="M0 800 Q400 782 800 800 Q1100 818 1400 800 Q1700 782 1920 800"/>
  </g>

  <!-- Distant headland silhouette -->
  <path d="M0 538 Q200 510 420 525 Q660 542 880 520 Q1100 498 1300 514 Q1540 530 1760 508 Q1880 496 1920 512 L1920 542 L0 542Z"
        fill="#111e3a" opacity="0.8"/>

  <!-- ── Resort building silhouette ── -->
  <!-- Main block -->
  <path d="M560 542 L560 380 L660 380 L660 330 L760 330 L760 278 L840 278 L840 240 L912 240 L912 208 L960 198 L1008 208 L1008 240 L1080 240 L1080 278 L1160 278 L1160 330 L1260 330 L1260 380 L1360 380 L1360 542Z"
        fill="url(#bld)"/>

  <!-- Window rows -->
  <g fill="#243060" opacity="0.7">
    <rect x="600" y="400" width="18" height="26" rx="9"/>
    <rect x="650" y="348" width="18" height="26" rx="9"/>
    <rect x="700" y="348" width="18" height="26" rx="9"/>
    <rect x="775" y="296" width="18" height="26" rx="9"/>
    <rect x="835" y="258" width="18" height="26" rx="9"/>
    <rect x="896" y="224" width="20" height="28" rx="10"/>
    <rect x="950" y="216" width="20" height="28" rx="10"/>
    <rect x="1006" y="224" width="20" height="28" rx="10"/>
    <rect x="1070" y="258" width="18" height="26" rx="9"/>
    <rect x="1130" y="296" width="18" height="26" rx="9"/>
    <rect x="1200" y="348" width="18" height="26" rx="9"/>
    <rect x="1255" y="348" width="18" height="26" rx="9"/>
    <rect x="1310" y="400" width="18" height="26" rx="9"/>
  </g>
  <!-- Lit windows (warm gold glow) -->
  <g filter="url(#glow)" opacity="0.85">
    <rect x="650" y="348" width="18" height="26" rx="9" fill="#f0c060"/>
    <rect x="775" y="296" width="18" height="26" rx="9" fill="#f0c060"/>
    <rect x="896" y="224" width="20" height="28" rx="10" fill="#f8d880"/>
    <rect x="950" y="216" width="20" height="28" rx="10" fill="#f8d880"/>
    <rect x="1070" y="258" width="18" height="26" rx="9" fill="#f0c060"/>
    <rect x="1200" y="348" width="18" height="26" rx="9" fill="#f0c060"/>
  </g>

  <!-- Side wings -->
  <rect x="280" y="440" width="90" height="102" rx="2" fill="url(#bld)" opacity="0.85"/>
  <rect x="1550" y="440" width="90" height="102" rx="2" fill="url(#bld)" opacity="0.85"/>
  <g filter="url(#glow)" fill="#f0c060" opacity="0.65">
    <rect x="298" y="458" width="14" height="20" rx="7"/>
    <rect x="328" y="458" width="14" height="20" rx="7"/>
    <rect x="1568" y="458" width="14" height="20" rx="7"/>
    <rect x="1598" y="458" width="14" height="20" rx="7"/>
  </g>

  <!-- ── Pool deck ── -->
  <path d="M440 542 L440 628 L1480 628 L1480 542Z" fill="#0c1620" opacity="0.88"/>
  <!-- Pool water -->
  <path d="M500 542 L500 618 L1420 618 L1420 542Z" fill="url(#pool)"/>
  <path d="M500 542 L500 618 L1420 618 L1420 542Z" fill="url(#poolGlow)"/>
  <!-- Pool top edge -->
  <line x1="500" y1="542" x2="1420" y2="542" stroke="#50b8d8" stroke-width="2" opacity="0.5"/>
  <!-- Pool ripples -->
  <g stroke="#80d8f8" stroke-width="0.9" fill="none" opacity="0.2">
    <path d="M520 558 Q720 550 960 558 Q1200 566 1400 558"/>
    <path d="M510 575 Q700 567 960 575 Q1220 583 1410 575"/>
    <path d="M505 594 Q720 586 960 594 Q1200 602 1415 594"/>
  </g>
  <!-- Pool edge lights -->
  <g fill="#50c8e8" filter="url(#glow)" opacity="0.7">
    <circle cx="520"  cy="542" r="4"/>
    <circle cx="680"  cy="542" r="4"/>
    <circle cx="840"  cy="542" r="4"/>
    <circle cx="960"  cy="542" r="4"/>
    <circle cx="1080" cy="542" r="4"/>
    <circle cx="1240" cy="542" r="4"/>
    <circle cx="1400" cy="542" r="4"/>
  </g>

  <!-- Deck furniture -->
  <g fill="#182840" opacity="0.7">
    <rect x="458" y="632" width="48" height="11" rx="5"/>
    <rect x="458" y="650" width="48" height="11" rx="5"/>
    <rect x="1414" y="632" width="48" height="11" rx="5"/>
    <rect x="1414" y="650" width="48" height="11" rx="5"/>
  </g>
  <!-- Parasols -->
  <g opacity="0.7">
    <ellipse cx="486"  cy="624" rx="36" ry="7"  fill="#b86838"/>
    <line x1="486"  y1="622" x2="486"  y2="664" stroke="#7a4022" stroke-width="3"/>
    <ellipse cx="1434" cy="624" rx="36" ry="7" fill="#b86838"/>
    <line x1="1434" y1="622" x2="1434" y2="664" stroke="#7a4022" stroke-width="3"/>
  </g>

  <!-- ── Palm trees ── -->
  <!-- Main left palm -->
  <path d="M195 1080 Q205 900 215 720 Q221 636 206 542" stroke="#281808" stroke-width="18" fill="none" stroke-linecap="round"/>
  <g stroke-linecap="round" fill="none">
    <path d="M206 542 Q155 492 80 470"  stroke="#1e4018" stroke-width="9"/>
    <path d="M206 542 Q122 522 62 542"  stroke="#224820" stroke-width="8"/>
    <path d="M206 542 Q164 482 182 408" stroke="#1e4018" stroke-width="8"/>
    <path d="M206 542 Q250 492 298 460" stroke="#224820" stroke-width="9"/>
    <path d="M206 542 Q265 515 316 530" stroke="#1e4018" stroke-width="7"/>
    <path d="M206 542 Q180 500 162 442" stroke="#224820" stroke-width="7"/>
  </g>

  <!-- Main right palm -->
  <path d="M1725 1080 Q1715 900 1705 720 Q1699 636 1714 542" stroke="#281808" stroke-width="18" fill="none" stroke-linecap="round"/>
  <g stroke-linecap="round" fill="none">
    <path d="M1714 542 Q1765 492 1840 470"  stroke="#1e4018" stroke-width="9"/>
    <path d="M1714 542 Q1798 522 1858 542"  stroke="#224820" stroke-width="8"/>
    <path d="M1714 542 Q1756 482 1738 408"  stroke="#1e4018" stroke-width="8"/>
    <path d="M1714 542 Q1670 492 1622 460"  stroke="#224820" stroke-width="9"/>
    <path d="M1714 542 Q1655 515 1604 530"  stroke="#1e4018" stroke-width="7"/>
    <path d="M1714 542 Q1740 500 1758 442"  stroke="#224820" stroke-width="7"/>
  </g>

  <!-- Small far-left palm -->
  <path d="M55 1080 Q62 940 68 800 Q72 720 65 625" stroke="#281808" stroke-width="12" fill="none" stroke-linecap="round"/>
  <g stroke-linecap="round" fill="none" opacity="0.65">
    <path d="M65 625 Q25 596 -8 582"    stroke="#1e4018" stroke-width="7"/>
    <path d="M65 625 Q100 596 132 606"  stroke="#224820" stroke-width="6"/>
    <path d="M65 625 Q48 588 50 548"    stroke="#1e4018" stroke-width="6"/>
  </g>

  <!-- Small far-right palm -->
  <path d="M1865 1080 Q1858 940 1852 800 Q1848 720 1855 625" stroke="#281808" stroke-width="12" fill="none" stroke-linecap="round"/>
  <g stroke-linecap="round" fill="none" opacity="0.65">
    <path d="M1855 625 Q1895 596 1928 582"   stroke="#1e4018" stroke-width="7"/>
    <path d="M1855 625 Q1820 596 1788 606"   stroke="#224820" stroke-width="6"/>
    <path d="M1855 625 Q1872 588 1870 548"   stroke="#1e4018" stroke-width="6"/>
  </g>

  <!-- Foreground ground -->
  <path d="M0 760 Q480 730 960 742 Q1440 754 1920 730 L1920 1080 L0 1080Z"
        fill="#060c18" opacity="0.65"/>

  <!-- Ground lamps (warm gold) -->
  <g filter="url(#glow)">
    <circle cx="420"  cy="768" r="12" fill="#e8c060" opacity="0.55"/>
    <circle cx="420"  cy="768" r="4"  fill="#fff8c0"/>
    <circle cx="710"  cy="784" r="12" fill="#e8c060" opacity="0.55"/>
    <circle cx="710"  cy="784" r="4"  fill="#fff8c0"/>
    <circle cx="1210" cy="784" r="12" fill="#e8c060" opacity="0.55"/>
    <circle cx="1210" cy="784" r="4"  fill="#fff8c0"/>
    <circle cx="1500" cy="768" r="12" fill="#e8c060" opacity="0.55"/>
    <circle cx="1500" cy="768" r="4"  fill="#fff8c0"/>
  </g>

  <!-- Vignette overlay -->
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
