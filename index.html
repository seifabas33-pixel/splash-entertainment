<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Old Palace Resort — Entertainment Program</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ═══ ENTRANCE ═══ -->
  <div id="entrance" class="entrance">
    <div id="particles-host"></div>
    <div class="wave-wrap">
      <div class="wave w1"></div>
      <div class="wave w2"></div>
      <div class="wave w3"></div>
    </div>
    <div class="entrance-card">
      <div class="e-logo-wrap">
        <img src="assets/splash-logo.svg" alt="Splash Entertainment" class="e-logo" />
      </div>
      <h1 class="e-resort">Old Palace Resort</h1>
      <p class="e-loc">✦ Sahl Hasheesh · Hurghada, Egypt ✦</p>
      <p class="e-date" id="e-date"></p>
      <div class="e-show" id="e-show"></div>
      <button class="e-btn" id="enter-btn">
        Explore Today's Program
        <span class="e-arrow">→</span>
      </button>
    </div>
  </div>

  <!-- ═══ APP ═══ -->
  <div id="app" class="app hidden">
    <header class="app-header">
      <img src="assets/splash-logo.svg" alt="Splash" class="app-logo" />
      <div class="app-header-text">
        <div class="app-resort-name">Old Palace Resort</div>
        <div class="app-date-sub" id="app-date-sub"></div>
      </div>
    </header>

    <main class="app-main">
      <div id="now-banner" class="now-banner hidden"></div>
      <div class="content-pad">
        <div id="show-section"></div>
        <div class="filter-bar" id="filter-bar"></div>
        <div class="activity-grid" id="activity-grid"></div>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
